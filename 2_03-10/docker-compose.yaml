services:
  redis:
    image: redis:8.12-rc3
    
  backend:
    image: thisthingexist/backend-example
    ports:
      - 8080:8080
    environment:
      - REQUEST_ORIGIN=http://localhost:5001
      - REDIS_HOST=redis
    restart: unless-stopped

  frontend:
    image: thisthingexist/frontend-example
    ports:
      - 5001:5001
